<div id="search-container">
    <!-- Search Input with Clear Button -->
    <div id="search-wrapper">
        <input type="text" id="search-input" placeholder="Type your search here..." autofocus>
        <span id="clear-button">&times;</span>
    </div>

    <!-- Search Results Count -->
    <div id="results-count" class='page-post-count'></div> <!-- This will display the number of results found -->

    <!-- Search Results Container -->
    <ul id="results-container"></ul>
</div>

<!-- Custom search (word-boundary + relevance sort); SimpleJekyllSearch no longer used -->

<style>
  #search-wrapper {
    position: relative;
    display: block;
    max-width: 600px;
    width: 100%;
    margin: 0 auto 10px; /* center on desktop */
    box-sizing: border-box;
    right: 1px;
  }

  #search-input {
    width: 100%;
    height: 44px;
    padding: 0 40px 0 12px;
    font-size: 16px;
    box-sizing: border-box;
    line-height: 44px;
  }

  #clear-button {
    position: absolute;
    right: 12px;
    top: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #888;
    cursor: pointer;
    display: none;
    user-select: none;
  }

  #clear-button:hover {
    color: #000;
  }

  @media (max-width: 768px) {
    #search-wrapper {
      max-width: 100%;
      width: 100%;
      padding: 0 12px;
      margin: 0 auto 10px;
      left: 18px;
    }

    #search-input {
      width: 100%;
    }

    #clear-button {
      right: 60px; /* inside the input padding */
    }
  }
</style>

<script>
    // Function to format allergens into HTML
    function formatAllergens(glutenFree, vegetarian, dairyFree, vegan, nutFree, sugarFree) {
        let allergenHTML = '';

        if (glutenFree) {
            allergenHTML += '<span class="allergen gluten-free" title="Gluten Free">GF</span> ';
        }
        if (vegetarian) {
            allergenHTML += '<span class="allergen vegetarian" title="Vegetarian">V</span> ';
        }
        if (dairyFree) {
            allergenHTML += '<span class="allergen dairy-free" title="Dairy Free">DF</span> ';
        }
        if (vegan) {
            allergenHTML += '<span class="allergen vegan" title="Vegan">VG</span> ';
        }
        if (nutFree) {
            allergenHTML += '<span class="allergen nut-free" title="Nut Free">NF</span> ';
        }
        if (sugarFree) {
            allergenHTML += '<span class="allergen sugar-free" title="Sugar Free">SF</span> ';
        }

        return allergenHTML.trim(); // Return the formatted string
    }

    // Custom search: word-boundary matching + relevance sort (title > tags > categories > other)
    const searchResultTemplate = `
            <li class="result-item"
                data-gluten-free="{gluten-free}"
                data-vegetarian="{vegetarian}"
                data-dairy-free="{dairy-free}"
                data-vegan="{vegan}"
                data-nut-free="{nut-free}"
                data-sugar-free="{sugar-free}">
                <a class='post-link' href="{url}">
                    <img src='{image}' alt='' class='blog-roll-image'>
                    <span class='post-meta'>{date}</span>
                    <div class='post-title'>
                        <a class='post-link' href="{url}">{title}</a>
                    </div>
                    <center>
                        <div class='allergen-container'>
                            <!-- Allergen HTML will be injected here -->
                        </div>
                    </center>
                </a>
            </li>`;

    function escapeRegex(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Match only full word or start of word (e.g. "oats" matches "oats" but not "boats")
    function textMatchesWordBoundary(text, term) {
      if (!text || typeof text !== 'string') return false;
      const escaped = escapeRegex(term.trim().toLowerCase());
      const re = new RegExp('(^|\\b)' + escaped, 'i');
      return re.test(text.trim());
    }

    function itemMatchesQuery(item, terms) {
      const searchable = [
        (item.title || ''),
        (item.tags || ''),
        (item.categories || ''),
        (item.ingred || '')
      ].join(' ');
      return terms.every(term => textMatchesWordBoundary(searchable, term));
    }

    function relevanceScore(item, terms) {
      let score = 0;
      const title = (item.title || '').toLowerCase();
      const tags = (item.tags || '').toLowerCase();
      const categories = (item.categories || '').toLowerCase();
      const ingred = (item.ingred || '').toLowerCase();
      for (const term of terms) {
        const t = term.trim().toLowerCase();
        if (!t) continue;
        const re = new RegExp('(^|\\b)' + escapeRegex(t), 'i');
        if (re.test(item.title || '')) score += 100;
        if (re.test(item.tags || '')) score += 50;
        if (re.test(item.categories || '')) score += 30;
        if (re.test(item.ingred || '')) score += 20;
      }
      return score;
    }

    function compileTemplate(item) {
      return searchResultTemplate.replace(/\{(\w+(-?\w+)*)\}/g, (_, key) => item[key] ?? '');
    }

    function parseDate(dateStr) {
      if (!dateStr) return 0;
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    let searchData = [];

    fetch('/search.json')
      .then(r => r.json())
      .then(json => {
        searchData = json;
        const q = document.getElementById('search-input').value.trim();
        if (q) runSearch(q);
      })
      .catch(() => { searchData = []; });

    function runSearch(query) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';
      const q = (query || '').trim();
      if (!q) {
        updateResultsUI();
        return;
      }
      const terms = q.split(/\s+/).filter(Boolean);
      const matches = searchData
        .filter(item => itemMatchesQuery(item, terms))
        .map(item => ({
          item,
          score: relevanceScore(item, terms),
          date: parseDate(item.date)
        }))
        .sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return b.date - a.date;
        })
        .map(x => x.item);
      if (matches.length === 0) {
        updateResultsUI();
        return;
      }
      matches.forEach(item => container.appendChild(
        Object.assign(document.createElement('div'), { innerHTML: compileTemplate(item) }).firstElementChild
      ));
      updateResultsUI();
    }

    document.getElementById('search-input').addEventListener('input', function() {
      runSearch(this.value);
    });

    const searchInput = document.getElementById('search-input');
    const resultsCountElement = document.getElementById('results-count');
    const clearButton = document.getElementById('clear-button');

    function updateResultsUI() {
      const resultItems = document.querySelectorAll('#results-container .result-item');
      const visibleItems = [...resultItems].filter(item => item.offsetParent !== null);
      const count = visibleItems.length;

      resultsCountElement.textContent = count > 0 ? `${count} result(s) found` : 'No results found';

      visibleItems.forEach((item, index) => {
        const countElement = item.querySelector('.post-count');
        if (countElement) countElement.textContent = `${index + 1}.`;

        const allergenContainer = item.querySelector('.allergen-container');
        if (allergenContainer) {
          allergenContainer.innerHTML = formatAllergens(
            item.getAttribute('data-gluten-free') === "true",
            item.getAttribute('data-vegetarian') === "true",
            item.getAttribute('data-dairy-free') === "true",
            item.getAttribute('data-vegan') === "true",
            item.getAttribute('data-nut-free') === "true",
            item.getAttribute('data-sugar-free') === "true"
          );
        }
      });
    }

    searchInput.addEventListener('input', () => {
      clearButton.style.display = searchInput.value.length ? 'block' : 'none';
      setTimeout(updateResultsUI, 0);
    });

    clearButton.addEventListener('click', () => {
      searchInput.value = '';
      clearButton.style.display = 'none';
      searchInput.focus();
      const event = new Event('input');
      searchInput.dispatchEvent(event);
    });
</script>

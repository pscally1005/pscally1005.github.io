- id: rxbar
  name: Rx Bar
  link: https://amzn.to/4h63UEd
  image: rx-bar.jpg
  file: rx-bar
  desc: Rx is my favorite snack bar on this list, for their taste, texture, and ingredients list. What you see is what you get with these, as <a href='https://amzn.to/4h63UEd'>RX bars</a> only have a few simple ingredients, such as <a href='/misc/nuts'>nuts</a>, <a href='/misc/fruit#dates'>dates</a>, and <a href='/misc/meat#egg-whites'>egg whites</a>.<br><br>However, I will admit, they're not a protein bar. They're a <a href='/misc/fruit#dates'>date</a> and <a href='/misc/nuts'>nut</a> bar with some <a href='/misc/meat#egg-whites'>egg white</a> protien powder. A Lara Bar with a bit of <a href='/misc/protein'>protein</a>.<br><br>I appreciate that they use <a href='/misc/fruit#dates'>dates</a> instead of <a href='/misc/hidden-sugar'>added sugar</a> for natural sweetness, and <a href='/misc/nuts'>nuts</a> instead of <a href='/misc/fats'>oils</a> for healthy, whole-food <a href='/misc/fats'>fats</a>. But 12 g of <a href='/misc/protein'>protein</a> per 200 <a href='/misc/calories'>calories</a> is a very poor <a href='/misc/high-protein'>protein to calorie ratio</a>. They're one of the best and healthiest packaged snacks you can buy, but not a protein bar. Or you can create them yourself for a fraction of the <a href='/misc/costs'>cost</a>, see my <a href="/recipes/rx-bars">Copycat Chocolate RX Bars</a>.<br><br>Also, did you know that <a href='https://amzn.to/4h63UEd'>Rx Bars</a> and <a href='#david'>David Bars</a> were created by the same person (Peter Rahal). Those things could not be more different. The former is a whole-foods snack bar, and the latter is an <a href='/misc/processed-foods'>ultra-processed</a> protein bar.

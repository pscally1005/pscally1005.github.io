---
layout: base
---
<div id="top-post"></div>

<div class="recipe">
  <article class="post h-entry" itemscope itemtype="https://schema.org/BlogPosting">

    <div class="post-content e-content" itemprop="articleBody">

      {% include top.html %}

      {% include buttons.html %}

      {% if page.categories.first != "Misc." or page.categories.last == "Unhealthy Recipes" %}
        {% include postInfo.html %}
      {% else %}
        <div class="recipe-section">{{ content }}</div>
      {% endif %}

      <font size="-1"><i>This post may contain affiliate links</i></font>

      {% include comments.html %}

    </div>

    <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
  </article>
</div>

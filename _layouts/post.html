---
layout: base
---
<div class='recipe'>
  <article class='post h-entry' itemscope itemtype='https://schema.org/BlogPosting'>

    <div class='post-content e-content' itemprop='articleBody'>

      {% include top.html %}

      {% include buttons.html %}

      {% if page.categories[0] != "Misc." or page.categories[1] == "Unhealthy Recipes" %}
        {% include postInfo.html %}
      {% else %}
        <div class='recipe-section'>{{ content }}</div>
      {% endif %}

      <font size='-1'><i>This post may contain affiliate links<br><br></i></font>

      {% include comments.html %}

    </div>

    <a class='u-url' href='{{ page.url | relative_url }}' hidden></a>
  </article>
</div>

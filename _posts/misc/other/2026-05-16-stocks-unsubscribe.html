<p id="stock-unsub-status">Processing your unsubscribe request…</p>
<p><a href="/misc/stocks">Back to the stock report page</a></p>

<script>
(function () {
  var apiUrl = {{ site.stocks_mailing_api_url | jsonify }};
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var status = document.getElementById('stock-unsub-status');

  if (!token) {
    status.textContent = 'Invalid unsubscribe link (missing token).';
    return;
  }
  if (!apiUrl) {
    status.textContent = 'Unsubscribe is not configured on this site yet.';
    return;
  }

  var target = apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?')
    + 'action=unsubscribe&token=' + encodeURIComponent(token);
  window.location.replace(target);
})();
</script>

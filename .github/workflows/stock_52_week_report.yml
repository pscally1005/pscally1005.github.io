# Sends the 52-week high/low stock email on weekdays (Mon–Fri), ~7 AM US Eastern.
#
# GitHub cron is UTC only and often runs LATE (30 min to several hours). We use a
# single 11:00 UTC slot (7:00 AM EDT). Do not add a second cron or an "hour == 7"
# gate — delayed jobs would skip sending entirely.
#
# Required secrets: SMTP_HOST, SMTP_USER, SMTP_PASSWORD
# Subscribers: python/stocks/subscribers.json

name: Daily 52-Week Stock Report

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: python/stocks
    steps:
      - name: Log run time
        if: github.event_name == 'schedule'
        run: |
          echo "Scheduled for 11:00 UTC (target ~7 AM US Eastern in EDT)."
          echo "Actual UTC:   $(date -u '+%Y-%m-%d %H:%M %Z')"
          echo "Actual Eastern: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/stocks/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TOLERANCE_PCT: ${{ secrets.TOLERANCE_PCT }}
          UNSUBSCRIBE_BASE_URL: https://www.poormanprotein.com/misc/stocks/unsubscribe
        run: python daily_52_week_report.py
